logger:
    file:
      path: /open5gs/install/var/log/open5gs/upf2.log
global:
  max:
    ue: MAX_NUM_UE
upf:
    pfcp:
      server:
        - address: UPF2_IP
      client:
        smf:
          - address: SMF2_IP
            dnn: urllc
    gtpu:
      server:
        - address: UPF2_IP
          advertise: UPF2_ADVERTISE_IP
    session:
      - subnet: UE_IPV4_URLLC_APN_SUBNET
        gateway: UE_IPV4_URLLC_APN_GATEWAY_IP
        dnn: urllc
        dev: UPF2_URLLC_APN_IF_NAME
      - subnet: 2001:230:fafe::/48
        gateway: 2001:230:fafe::1
        dnn: urllc
        dev: UPF2_URLLC_APN_IF_NAME
    metrics:
      server:
        - address: UPF2_IP
          port: 9091
