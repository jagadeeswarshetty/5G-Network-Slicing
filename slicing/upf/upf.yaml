logger:
    file:
      path: /open5gs/install/var/log/open5gs/upf.log
global:
  max:
    ue: MAX_NUM_UE
upf:
    pfcp:
      server:
        - address: UPF_IP
      client:
        smf:
          - address: SMF_IP
            dnn: embb
    gtpu:
      server:
        - address: UPF_IP
          advertise: UPF_ADVERTISE_IP
    session:
      - subnet: UE_IPV4_EMBB_APN_SUBNET
        gateway: UE_IPV4_EMBB_APN_GATEWAY_IP
        dnn: embb
        dev: UPF_EMBB_APN_IF_NAME
      - subnet: 2001:230:cafe::/48
        gateway: 2001:230:cafe::1
        dnn: embb
        dev: UPF_EMBB_APN_IF_NAME
    metrics:
      server:
        - address: UPF_IP
          port: 9091
