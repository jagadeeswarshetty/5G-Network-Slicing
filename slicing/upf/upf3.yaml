logger:
    file:
      path: /open5gs/install/var/log/open5gs/upf3.log
global:
  max:
    ue: MAX_NUM_UE
upf:
    pfcp:
      server:
        - address: UPF3_IP
      client:
        smf:
          - address: SMF3_IP
            dnn: mmtc
    gtpu:
      server:
        - address: UPF3_IP
          advertise: UPF3_ADVERTISE_IP
    session:
      - subnet: UE_IPV4_MMTC_APN_SUBNET
        gateway: UE_IPV4_MMTC_APN_GATEWAY_IP
        dnn: mmtc
        dev: UPF3_MMTC_APN_IF_NAME
      - subnet: 2001:230:dafe::/48
        gateway: 2001:230:dafe::1
        dnn: mmtc
        dev: UPF3_MMTC_APN_IF_NAME
    metrics:
      server:
        - address: UPF3_IP
          port: 9091
